<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo Bárbara Emily</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fffaf7;--cream:#f6eae6;--deep:#5b0f18;--muted:#e9d9d7;
  --text:#2b2b2b;--accent:#7a1b24;--soft:#594a49;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* HEADER */
header{
  background:var(--bg);
  color:var(--deep);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 20px;
  border-bottom:1px solid var(--muted);
}
.logoArea{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;object-fit:cover}
.titulo{
  font-family:'Playfair Display',serif;
  font-size:clamp(16px,4.2vw,22px);
  font-weight:700;
  letter-spacing:.04em;
}

/* HERO */
.hero{
  max-width:1100px;
  margin:20px auto 8px;
  padding:0 20px;
}
.hero-card{
  display:grid;
  grid-template-columns:1fr 42%;
  min-height:250px;
  border-radius:12px;
  overflow:hidden;
  background:linear-gradient(180deg,rgba(91,15,24,.95),rgba(91,15,24,.86));
  color:#fff;
}
.hero.sem-foto .hero-card{grid-template-columns:1fr}
.hero.sem-foto .hero-right{display:none}
.hero-left{
  padding:36px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
}
.hero-brand{
  font-family:'Playfair Display',serif;
  font-size:clamp(30px,6vw,44px);
  line-height:1.1;
  margin:0;
}
.hero-tag{font-size:17px;margin:10px 0 20px}
.hero-cta{
  display:inline-block;
  background:#fff;
  color:var(--deep);
  padding:10px 20px;
  border-radius:999px;
  text-decoration:none;
  font-weight:600;
}
.hero-cta:hover{background:var(--cream)}
.hero-right{position:relative;min-height:250px}
.hero-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  /* a imagem "derrete" no vinho do banner */
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 40%);
  mask-image:linear-gradient(to right,transparent 0,#000 40%);
}
/* imagem inteira (arte da promoção com texto): sem desbotar as bordas */
.hero.img-inteira .hero-image{
  inset:12px;
  width:calc(100% - 24px);
  height:calc(100% - 24px);
  object-fit:contain;
  -webkit-mask-image:none;
  mask-image:none;
}

/* AVISO */
#bannerAviso{
  display:none;
  width:100%;
  padding:12px;
  text-align:center;
  font-weight:bold;
  box-sizing:border-box;
}
@keyframes piscarBanner{0%{opacity:1}50%{opacity:.8}100%{opacity:1}}
@keyframes pulsarTexto{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.bannerTextoPulsando{display:inline-block;animation:pulsarTexto 1.2s infinite}

/* TARJA DE OFERTA */
.imgBox{position:relative;overflow:hidden;border-radius:8px}
.fitaOferta{
  position:absolute;
  top:0;
  left:0;
  width:112px;
  height:112px;
  overflow:hidden;
  pointer-events:none;
  z-index:3;
}
.fitaOferta span{
  position:absolute;
  top:24px;
  left:-36px;
  width:160px;
  transform:rotate(-45deg);
  background:#a31621;
  color:#fff;
  font-size:11px;
  font-weight:700;
  text-align:center;
  padding:5px 0;
  box-shadow:0 2px 5px rgba(0,0,0,.3);
}

/* PRODUTOS EM DESTAQUE */
.destaques{max-width:1100px;margin:0 auto;padding:20px 20px 0}
.destaques[hidden]{display:none}
.destaques h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(20px,4.5vw,26px);
  color:var(--deep);
  margin:0 0 4px;
}
.destaques .grid{padding:12px 0 8px;margin:0;max-width:none}
.card.realce{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* BUSCA E FILTROS */
.catalogoTopo{max-width:1100px;margin:0 auto;padding:16px 20px 0}
#buscaCliente{
  width:100%;
  padding:12px 16px;
  border:1px solid var(--muted);
  border-radius:999px;
  background:#fff;
  font-size:15px;
  margin-bottom:12px;
}

/* CARRINHO (botão flutuante) */
.cartBtn{
  position:fixed;
  top:14px;
  right:16px;
  width:46px;
  height:46px;
  border:none;
  border-radius:50%;
  background:var(--deep);
  color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  cursor:pointer;
  z-index:1001;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  transition:transform .2s;
}
.cartBtn:hover{transform:scale(1.05)}
#cartBadge{
  position:absolute;
  top:-6px;
  right:-4px;
  background:#fff;
  color:var(--deep);
  border:2px solid var(--deep);
  font-size:12px;
  font-weight:bold;
  width:22px;
  height:22px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PRODUTOS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:20px;
  max-width:1100px;
  margin:0 auto;
  padding:16px 20px 32px;
}
.card{
  background:var(--cream);
  border-radius:12px;
  padding:16px;
  text-align:center;
  display:flex;
  flex-direction:column;
}
.card img{
  width:100%;
  height:180px;
  object-fit:contain;
  background:#fff;
  border-radius:8px;
}
.card h3{
  font-family:'Playfair Display',serif;
  font-size:18px;
  line-height:1.3;
  margin:14px 0 4px;
}
.card select{margin-top:8px}
.price{font-weight:700;color:var(--deep);font-size:18px;margin-top:6px}
.stock{font-size:13px;margin-top:4px;color:var(--soft)}
.btn{
  margin-top:auto;
  width:100%;
  padding:11px;
  background:var(--deep);
  color:#fff;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
  transition:background .2s;
}
.card .btn{margin-top:12px}
.btn:hover{background:var(--accent)}

/* PAINEL DO CARRINHO */
.cartPanel{
  position:fixed;
  top:0;
  right:0;
  width:340px;
  max-width:100%;
  height:100%;
  background:var(--bg);
  padding:70px 18px 18px;
  box-shadow:-5px 0 15px rgba(0,0,0,.35);
  display:none;
  z-index:1000;
  overflow-y:auto;
}
.cartHeader{display:flex;justify-content:space-between;align-items:center}
.closeBtn{background:var(--cream);border:none;padding:6px 10px;border-radius:6px;cursor:pointer}
.cartItem{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:8px}
.qtyControls{display:flex;align-items:center;gap:5px}
.qtyBtn{
  background:var(--deep);
  color:#fff;
  border:none;
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
}
.removeBtn{
  background:#fff;
  border:1px solid var(--accent);
  color:var(--accent);
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
}
select,textarea{
  width:100%;
  margin-top:8px;
  padding:9px;
  border-radius:8px;
  border:1px solid var(--muted);
  background:#fff;
  font-family:inherit;
}
.instagramBtn{
  width:100%;
  padding:10px;
  background:var(--deep);
  color:#fff;
  border:none;
  border-radius:999px;
  margin-top:8px;
  cursor:pointer;
}
.totalBox{
  font-family:'Playfair Display',serif;
  color:var(--deep);
  font-weight:700;
  font-size:22px;
  margin:4px 0;
  display:inline-block;
}

#btnTopo{
  position:fixed;
  bottom:12px;
  right:12px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:var(--deep);
  color:#fff;
  font-size:20px;
  cursor:pointer;
  z-index:9999;
  display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
#btnTopo:hover{transform:scale(1.05)}

/* CELULAR */
@media (max-width:700px){
  .hero{padding:0 14px}
  .hero-card{grid-template-columns:1fr}
  .hero-right{order:-1;min-height:190px}
  .hero-image{
    -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);
  }
  .hero-left{padding:8px 26px 28px}
  .catalogoTopo{padding:14px 14px 0}
  .destaques{padding:16px 14px 0}
  .fitaOferta{width:92px;height:92px}
  .fitaOferta span{top:18px;left:-34px;width:130px;font-size:10px;padding:4px 0}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 14px 28px}
  .card{padding:10px}
  .card img{height:130px}
  .card h3{font-size:15px}
  .cartPanel{width:100%}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .bannerTextoPulsando{animation:none}
  .cartBtn,.btn{transition:none}
}

</style>
</head>

<body>

<header>
  <div class="logoArea">
    <img src="imagens/00/Logo.jpg" class="logo" id="logoLoja" alt="Logo Bárbara Emily">
    <b class="titulo">BÁRBARA EMILY</b>
  </div>

  <button class="cartBtn" onclick="toggleCarrinho()" aria-label="Abrir carrinho">
    🛒
    <span id="cartBadge">0</span>
  </button>
</header>

<div id="bannerAviso" class="banner-aviso" style="display:none;">
  <span id="textoBanner"></span>
</div>


<section class="hero" id="heroLoja">
  <div class="hero-card">
  <div class="hero-left">
    <h1 class="hero-brand" id="heroTitulo">Beleza com identidade.</h1>
    <p class="hero-tag" id="heroSubtitulo">Escolha seus produtos e finalize o pedido pelo carrinho.</p>
    <a class="hero-cta" id="heroBotao" href="#produtosContainer">Ver produtos</a>
  </div>
  <div class="hero-right">
    <img src="imagens/00/01.png" alt="" class="hero-image"
         onerror="this.closest('.hero').classList.add('sem-foto')">
  </div>
  </div>
</section>

<section class="destaques" id="destaquesLoja" hidden>
  <h2 id="destaquesTitulo">Produtos em destaque</h2>
  <div class="grid" id="destaquesContainer"></div>
</section>

<!-- PRODUTOS AUTOMÁTICOS -->

<div class="catalogoTopo">
  <input
    id="buscaCliente"
    placeholder="🔍 Buscar produto..."
    oninput="filtrarProdutosCliente()"
  >

  <div id="filtrosCategoriaCliente" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
    <button onclick="filtrarCategoriaCliente('todos')">Todos</button>
  </div>
</div>

<div class="grid" id="produtosContainer"></div>
<div id="mensagemSemProdutos" style="display:none; text-align:center; padding:20px; color:#666; font-weight:bold;">
  🔍 Nenhum produto encontrado
</div>

<button id="btnTopo" onclick="voltarAoTopo()">
  ⬆
</button>


<!-- CARRINHO -->

<div id="cartPanel" class="cartPanel">

<button type="button" class="closeBtn" onclick="toggleCarrinho()" style="position:absolute;top:18px;left:18px;">← Continuar comprando</button>

<p class="totalBox">Total: R$ <span id="total">0.00</span></p>

<input
  type="text"
  id="nomeCliente"
  placeholder="Nome completo"
  style="width:100%; margin-top:8px; padding:8px; border-radius:6px; border:1px solid #ccc;"
>

<input
  type="tel"
  id="contatoCliente"
  placeholder="(85) 99999-9999"
  style="width:100%; margin-top:8px; padding:8px; border-radius:6px; border:1px solid #ccc;"
>

<select id="entrega" onchange="mostrarBairrosEntrega()">
  <option value="">Opções de entrega</option>

  <option value="retirada">
    Retirar na loja
  </option>

  <option value="uber">
    Via Uber flash (por conta do cliente)
  </option>

  <option value="loja">
    Entrega pela loja
  </option>
</select>

<div id="areaBairroEntrega" style="display:none; margin-top:8px;">

  <select id="bairroEntrega" onchange="atualizarTaxaBairro()">
    <option value="">Selecione seu bairro</option>
  </select>

  <textarea
    id="enderecoEntrega"
    placeholder="Rua, número, complemento e ponto de referência"
    style="
      width:100%;
      margin-top:8px;
      padding:10px;
      border:1px solid #ccc;
      border-radius:8px;
      resize:vertical;
    "
    rows="3"
  ></textarea>

</div>

<select id="pagamento">
  <option value="">Forma de pagamento</option>
  <option id="opcaoDinheiro" value="Dinheiro">Dinheiro</option>
  <option value="PIX">PIX</option>
  <option value="Cartao">Cartão</option>
</select>

<div id="lista"></div>

<button class="btn" onclick="limparCarrinho()">Limpar</button>

<button class="btn" onclick="finalizarPedido()">
📲 Finalizar Pedido
</button>

<textarea
  id="observacoesPedido"
  placeholder="Observações do pedido (opcional)"
  rows="4"
  style="
    width:100%;
    margin-top:10px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    resize:vertical;
  "
></textarea>

</div>



<!-- MODAL -->

<script type="module">

  let reservasProcessando = new Set();

  let limpandoCarrinho = false;

 import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  onSnapshot,
  addDoc,
  updateDoc,
  deleteDoc,
  increment,
  doc,
  runTransaction,
  serverTimestamp,
  query,
  orderBy,
  where,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA0XLQUStr9FIakDjHTMFgiWA4S1o3Jylc",
  authDomain: "catalogo-be.firebaseapp.com",
  projectId: "catalogo-be",
  storageBucket: "catalogo-be.firebasestorage.app",
  messagingSenderId: "422107892897",
  appId: "1:422107892897:web:ac978acc8cf83106f174e0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let carrinho = [];
let produtos = [];
let taxaEntregaBairro = 0;
let categoriaFiltroCliente = "todos";
let unsubscribePedidosAdmin = null;
let statusFiltroPedidosAtual = "todos";
let buscaPedidosAdminTimer = null;

let configLoja = {
  descontoPix: 5,
  minimoPix: 50,

  taxasEntrega: {
    "Centro": 5,
    "Aldeota": 8,
    "Meireles": 10,
    "Papicu": 12
  },

  bannerAviso: {
    ativo: true,
    texto: "",
    corFundo: "#FFD700",
    corTexto: "#000000"
  },

  destaquesProdutos: {
    ativo: true,
    titulo: "Produtos em destaque"
  },

  destaque: {
    ativo: true,
    titulo: "Beleza com identidade.",
    subtitulo: "Escolha seus produtos e finalize o pedido pelo carrinho.",
    textoBotao: "Ver produtos",
    imagemAtiva: false,
    imagemDados: "",
    imagemAjuste: "cover"
  }
};

// Imagem escolhida no painel e ainda não salva (null = sem alteração, "" = remover)
let heroImagemPendente = null;

// 🔐 login admin
let adminLogado = false;
let adminEmail = "";

onAuthStateChanged(auth, (user) => {
  if (user) {
    adminLogado = true;
    adminEmail = user.email || "";
    console.log("Admin logado:", adminEmail);
  } else {
    adminLogado = false;
    adminEmail = "";
    console.log("Nenhum admin logado");
  }
});



async function carregarConfigLoja() {

  const ref = doc(db, "Configuracoes", "Loja");
  const snap = await getDoc(ref);

  if (!snap.exists()) return;

  configLoja = {
    ...configLoja,
    ...snap.data()
  };

  configLoja.descontoPix = Number(configLoja.descontoPix ?? 5);
  configLoja.minimoPix = Number(configLoja.minimoPix ?? 50);

  const campoDescontoPix = document.getElementById("descontoPixAdmin");
  const campoMinimoPix = document.getElementById("minimoPixAdmin");

  if (campoDescontoPix) {
    campoDescontoPix.value = configLoja.descontoPix;
  }

  if (campoMinimoPix) {
    campoMinimoPix.value = configLoja.minimoPix;
  }

  if (document.getElementById("bannerAtivo")) {

    document.getElementById("bannerAtivo").checked =
      configLoja.bannerAviso?.ativo || false;

    document.getElementById("bannerTexto").value =
      configLoja.bannerAviso?.texto || "";

    document.getElementById("bannerCorFundo").value =
      configLoja.bannerAviso?.corFundo || "#FFD700";

    document.getElementById("bannerCorTexto").value =
      configLoja.bannerAviso?.corTexto || "#000000";

      if (document.getElementById("taxasEntregaAdmin")) {

        let texto = "";

        Object.entries(configLoja.taxasEntrega || {})
          .forEach(([bairro, valor]) => {

            texto += `${bairro}=${valor}\n`;

          });

        document.getElementById("taxasEntregaAdmin").value = texto;
      }

  }

  if (document.getElementById("liveAtivaAdmin")) {
    document.getElementById("liveAtivaAdmin").checked =
      configLoja.liveAtiva || false;
  }

  atualizarBannerAviso();
}

let unsubscribeProdutos = null;

function carregarProdutosFirebase() {

      if (unsubscribeProdutos) {
      unsubscribeProdutos();
    }

    unsubscribeProdutos = onSnapshot(
        collection(db, "Produtos"),
    (snapshot) => {

      produtos = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));

      produtos.sort((a, b) => {

        const ordemA = a.ordem ?? 999;
        const ordemB = b.ordem ?? 999;

        if (ordemA !== ordemB) {
          return ordemA - ordemB;
        }

        return (a.nome || "").localeCompare(
          b.nome || "",
          "pt-BR"
        );

      });

      gerarProdutos();

      /*
       * O HTML dos produtos já foi inserido no DOM.
       * Não precisamos esperar outro ciclo do navegador.
       */
      produtos.forEach((p, index) => {

        if (p.ativo === false) return;

        const id = index + 1;

        const stock = document.getElementById(
          "stock" + id
        );

        if (stock) {
          mostrarEstoque("stock" + id);
        }

        const select = document.getElementById(
          "op" + id
        );

        if (select) {
          atualizarSelect(
            "op" + id,
            "stock" + id
          );
        }

      });

      renderFiltrosCategoriaCliente();

      filtrarProdutosCliente();

    },
    (erro) => {

      console.error(
        "Erro ao ouvir produtos do Firebase:",
        erro
      );

      alert(
        "Erro ao carregar produtos."
      );

    }
  );

}

function gerarProdutos() {

  const container = document.getElementById("produtosContainer");

  if (!container) return;

  let html = "";

  produtos.forEach((p, index) => {

    if (p.ativo === false) return;

    try {

      if (!p || !p.nome || p.preco == null) return;

      const idTela = index + 1;

      const temOpcoes =
        Array.isArray(p.opcoes) &&
        p.opcoes.length > 0;

      let opcoesHTML = "";

      if (temOpcoes) {

        opcoesHTML = `<option value="">Opções</option>`;

        p.opcoes.forEach(op => {

          opcoesHTML +=
            `<option value="${op}" data-img="${op}.jpg">${op}</option>`;

        });
      }

      let precoExibido = Number(p.preco || 0);

      let htmlPreco =
        `R$ ${precoExibido.toFixed(2)}`;

      if (produtoPodeUsarPrecoLive(p)) {

        precoExibido = Number(p.precoLive);

        htmlPreco = `
          <div style="
            text-decoration:line-through;
            color:#999;
            font-size:14px;
          ">
            R$ ${Number(p.preco).toFixed(2)}
          </div>

          <div style="
            color:#e60023;
            font-weight:bold;
            font-size:22px;
          ">
            🔥Por R$ ${precoExibido.toFixed(2)}
          </div>
        `;
      }

      let tarjasHTML = "";

      const categoriasDestaque = Array.isArray(p.categoriasAdicionais)
        ? p.categoriasAdicionais.filter(c => c && c.trim())
        : [];

      if (categoriasDestaque.length > 0) {
        tarjasHTML = `
          <div style="
            position:absolute;
            top:8px;
            ${p.promocao ? "right:8px; justify-content:flex-end;" : "left:8px;"}
            display:flex;
            flex-wrap:wrap;
            gap:5px;
            z-index:2;
          ">
            ${categoriasDestaque.map(c => `
              <span style="
                background:#5b0f18;

function renderDestaques() {
  const secao = document.getElementById("destaquesLoja");
  const box = document.getElementById("destaquesContainer");
  if (!secao || !box) return;

  const cfg = configLoja.destaquesProdutos || {};

  const lista = produtos.filter(p =>
    p && p.destaque === true &&
    p.ativo !== false &&
    p.nome && p.preco != null
  );

  if (cfg.ativo === false || lista.length === 0) {
    secao.hidden = true;
    box.innerHTML = "";
    return;
  }

  document.getElementById("destaquesTitulo").textContent =
    cfg.titulo || "Produtos em destaque";

  box.innerHTML = "";

  lista.forEach(p => {
    const temOpcoes = Array.isArray(p.opcoes) && p.opcoes.length > 0;
    const temEstoque = produtoTemEstoqueTela(p);
    const usaLive = produtoPodeUsarPrecoLive(p);

    const card = document.createElement("div");
    card.className = "card";

    const caixaImg = document.createElement("div");
    caixaImg.className = "imgBox";

    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = p.nome;
    img.src = `imagens/${p.pasta || ""}/${p.imagem || ""}`;
    img.onerror = function () {
      this.onerror = null;
      this.src = "imagens/sem-imagem.jpg";
    };

    const titulo = document.createElement("h3");
    titulo.textContent = p.marca ? `${p.nome} - ${p.marca}` : p.nome;

    const preco = document.createElement("div");
    preco.className = "price";
    if (usaLive) {
      preco.textContent = `R$ ${Number(p.precoLive).toFixed(2)}`;
    } else {
      preco.textContent = `R$ ${Number(p.preco).toFixed(2)}`;
    }

    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "btn";

    if (!temEstoque) {
      botao.textContent = "Esgotado";
      botao.disabled = true;
    } else if (temOpcoes) {
      botao.textContent = "Escolher opção";
      botao.addEventListener("click", () => irParaProduto(p.id));
    } else {
      botao.textContent = "Adicionar";
      botao.addEventListener("click", () => window.addProduto(p.id, null));
    }

    caixaImg.appendChild(img);

    if (p.promocao) {
      const fita = document.createElement("div");
      fita.className = "fitaOferta";
      const txt = document.createElement("span");
      txt.textContent = "Oferta especial";
      fita.appendChild(txt);
      caixaImg.appendChild(fita);
    }

    card.append(caixaImg, titulo, preco, botao);
    box.appendChild(card);
  });

  secao.hidden = false;
}

// Reduz a imagem e converte para JPEG leve (cabe no documento de configuração)
function comprimirImagemDestaque(arquivo) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(arquivo);
    const imagem = new Image();

    imagem.onload = () => {
      URL.revokeObjectURL(url);

      const limiteChars = 120 * 1024 * 1.37; // ~120 KB em base64
      let largura = Math.min(900, imagem.naturalWidth);

      for (let tentativa = 0; tentativa < 8; tentativa++) {
        const altura = Math.round(imagem.naturalHeight * (largura / imagem.naturalWidth));
        const canvas = document.createElement("canvas");
        canvas.width = largura;
        canvas.height = altura;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, largura, altura);
        ctx.drawImage(imagem, 0, 0, largura, altura);

        for (let q = 0.85; q >= 0.45; q -= 0.1) {
          const dados = canvas.toDataURL("image/jpeg", q);
          if (dados.length <= limiteChars) {
            resolve(dados);
            return;
          }
        }

        largura = Math.round(largura * 0.8);
      }

      reject(new Error("Não foi possível reduzir a imagem o suficiente."));
    };

    imagem.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Arquivo de imagem inválido."));
    };

    imagem.src = url;
  });
}

async function escolherImagemDestaqueAdmin(evento) {
  const arquivo = evento.target.files && evento.target.files[0];
  const status = document.getElementById("heroImagemStatusAdmin");
  if (!arquivo) return;

  if (!arquivo.type.startsWith("image/")) {
    alert("Escolha um arquivo de imagem (JPG, PNG ou WEBP).");
    evento.target.value = "";
    return;
  }

  status.textContent = "Preparando imagem...";

  try {
    heroImagemPendente = await comprimirImagemDestaque(arquivo);
    mostrarPreviewImagemAdmin(heroImagemPendente);
    status.textContent = "Imagem pronta. Clique em \"Salvar configuração\" para publicar.";
  } catch (erro) {
    console.error("Erro ao preparar imagem:", erro);
    status.textContent = "";
    alert("Não foi possível usar essa imagem. Tente outra.");
  }

  evento.target.value = "";
}

function mostrarEstoque(stockId) {
  let id = stockId.replace("stock", "");
  let select = document.getElementById("op" + id);
  let div = document.getElementById(stockId);

  let produto = produtos[id - 1];
  if (!produto) return;

  let estoque = produto.estoque;
  let temOpcoes = Array.isArray(produto.opcoes) && produto.opcoes.length > 0;

  if (typeof estoque === "number") {
    div.innerHTML = estoque <= 0
      ? `🔴 Esgotado`
      : `🟢 Disponível`;
    return;
  }

  if (temOpcoes) {
    if (select && select.value) {
      let opcao = select.value;
      let qtd = Number(estoque[opcao] || 0);

      div.innerHTML = qtd <= 0
        ? `🔴 ${opcao}: Esgotado`
        : `🟢 ${opcao}: Disponível`;
      return;
    }

    div.innerHTML = `<b>Selecione uma opção</b>`;
    return;
  }

  let qtdUnico = Number(estoque?.unico || 0);

  div.innerHTML = qtdUnico <= 0
    ? `🔴 Esgotado`
    : `🟢 Disponível`;
}


async function devolverEstoqueProduto(produtoId, opcao, quantidade = 1) {
  const ref = doc(db, "Produtos", produtoId);

  await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(ref);

    if (!snap.exists()) {
      throw new Error("Produto não encontrado");
    }

    const produto = snap.data();
    let estoque = produto.estoque || {};

    let chaveEstoque = opcao || "unico";
    let atual = Number(estoque[chaveEstoque] || 0);

    transaction.update(ref, {
      [`estoque.${chaveEstoque}`]: atual + quantidade
    });
  });
}


let tempoReserva = 5 * 60 * 1000 // 5 minutos

function salvarCarrinhoLocal() {
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
}

async function carregarCarrinhoLocal() {
  let dados = localStorage.getItem("carrinho");
  if (!dados) return;

  carrinho = JSON.parse(dados);

  let agora = Date.now();

  for (let i = carrinho.length - 1; i >= 0; i--) {
    let item = carrinho[i];

    if (agora - item.tempo > tempoReserva) {
      await expirarReserva(item);
      carrinho.splice(i, 1);
    }
  }

  salvarCarrinhoLocal();
  atualizarCarrinho();
}

async function baixarEstoqueProduto(produtoId, opcao, quantidade = 1) {
  const ref = doc(db, "Produtos", produtoId);

  await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(ref);

    if (!snap.exists()) {
      throw new Error("Produto não encontrado");
    }

    const produto = snap.data();
    let estoque = produto.estoque || {};

    let chaveEstoque = opcao || "unico";
    let atual = Number(estoque[chaveEstoque] || 0);

function atualizarCarrinho() {

  let entregaSelect = document.getElementById("entrega");
  let totalEl = document.getElementById("total");
  let badgeEl = document.getElementById("cartBadge");

  if (!lista || !pagamentoSelect || !entregaSelect || !totalEl || !badgeEl) return;

  let htmlLista = "";

  let subtotal = 0;
  let subtotalElegivelPix = 0;
  let qtd = 0;

  carrinho.forEach((item, index) => {
    let sub = Number(item.preco || 0) * Number(item.qtd || 0);

    subtotal += sub;
    qtd += Number(item.qtd || 0);

    if (!item.promocao) {
      subtotalElegivelPix += sub;
    }

    htmlLista += `
      <div class="cartItem">
        <div>
          ${item.nome}<br>
          R$ ${Number(item.preco).toFixed(2)}
        </div>

        <div class="qtyControls">
          <button class="qtyBtn" onclick="diminuir(${index})">-</button>
          <b>${item.qtd}</b>
          <button class="qtyBtn" onclick="aumentar(${index})">+</button>
          <button class="removeBtn" onclick="remover(${index})">X</button>
        </div>
      </div>
    `;
  });

  let taxa = 0;

if (entregaSelect.value === "loja") {

  taxa = taxaEntregaBairro;

} else {

  let taxa = Number(entregaSelect.value);

    if (isNaN(taxa)) {
      taxa = 0;
    }
}

let pagamento = String(pagamentoSelect.value || "").trim();

let desconto = 0;
let minimoPix = Number(configLoja.minimoPix || 0);
let descontoPix = Number(configLoja.descontoPix || 0);

if (pagamento === "PIX" && subtotalElegivelPix >= minimoPix) {
  desconto = subtotalElegivelPix * (descontoPix / 100);
}

  let total = subtotal + taxa - desconto;

  htmlLista += `
    <div style="margin-top:12px; border-top:1px solid #ddd; padding-top:10px;">
      <div>Subtotal: R$ ${subtotal.toFixed(2)}</div>
      <div>Entrega: R$ ${taxa.toFixed(2)}</div>

      ${
        pagamento === "PIX" && subtotalElegivelPix < minimoPix
          ? `<div style="color:#8b0000;">
              Desconto no PIX acima de R$ ${minimoPix.toFixed(2)} Exceto produtos em oferta
            </div>`
          : ""
      }

      ${
        desconto > 0
          ? `<div style="color:green; font-weight:bold;">
              Desconto PIX (${descontoPix}%): - R$ ${desconto.toFixed(2)}
            </div>`
          : ""
      }
    </div>
  `;

  lista.innerHTML = htmlLista;
  totalEl.innerText = total.toFixed(2);
  badgeEl.innerText = qtd;
}

window.addProduto = async function(produtoId, selectId) {
  let produto = produtos.find(p => p.id === produtoId);
  if (!produto) return;

  let temOpcoes = Array.isArray(produto.opcoes) && produto.opcoes.length > 0;
  let opcaoTexto = "unico";

  if (temOpcoes) {
    let select = document.getElementById(selectId);

    if (!select || !select.value) {
      alert("Selecione uma opção");
      return;
    }

    opcaoTexto = select.value;
  }

  const nomeFinal = temOpcoes
    ? `${produto.nome} – ${opcaoTexto}`
    : produto.nome;

  const itemExistente = carrinho.find(
    item => item.nome === nomeFinal && item.produtoId === produtoId
  );

  const produtoRef = doc(db, "Produtos", produtoId);
  const reservasRef = collection(db, "Reservas");
  const novaReservaRef = doc(reservasRef);

  const reservaExistenteRef = itemExistente?.reservaId
    ? doc(db, "Reservas", itemExistente.reservaId)
    : null;

  try {
    let novaReservaId = null;

    await runTransaction(db, async (transaction) => {
      const produtoSnap = await transaction.get(produtoRef);

      if (!produtoSnap.exists()) {
        throw new Error("Produto não encontrado");
      }

      let reservaSnap = null;

      if (reservaExistenteRef) {
        reservaSnap = await transaction.get(reservaExistenteRef);
      }

      const dados = produtoSnap.data();
      const estoque = dados.estoque;

      let atual = 0;
      let estoqueNumerico = typeof estoque === "number";
      const chave = opcaoTexto || "unico";

      if (estoqueNumerico) {
        atual = Number(estoque);
      } else {
        atual = Number(estoque?.[chave] || 0);
      }

      if (atual <= 0) {
        throw new Error("Sem estoque");
      }

      if (estoqueNumerico) {
        transaction.update(produtoRef, {
          estoque: atual - 1
        });
      } else {
        transaction.update(produtoRef, {
          [`estoque.${chave}`]: atual - 1
        });
      }

      const reservaAtiva =
        reservaSnap &&
        reservaSnap.exists() &&
        reservaSnap.data().status === "ativa";

      if (reservaAtiva) {
        const qtdReservada = Number(reservaSnap.data().qtd || 0);

        transaction.update(reservaExistenteRef, {
          qtd: qtdReservada + 1
        });

        novaReservaId = itemExistente.reservaId;

      } else {
        transaction.set(novaReservaRef, {
          produtoId: produtoId,
          nome: nomeFinal,
          opcao: opcaoTexto,
          qtd: 1,
          status: "ativa",
          criadoEmMs: Date.now(),
          criadoEm: serverTimestamp()
        });

        novaReservaId = novaReservaRef.id;
      }
    });

    if (itemExistente) {
      itemExistente.qtd++;
      itemExistente.tempo = Date.now();
      itemExistente.reservaId = novaReservaId;

    } else {
      let precoFinal = Number(produto.preco);

      if (produtoPodeUsarPrecoLive(produto)) {
        
        precoFinal = Number(produto.precoLive);
      }

      carrinho.push({
        produtoId: produto.id,
        nome: nomeFinal,
        preco: precoFinal,
        qtd: 1,
        opcao: opcaoTexto,
        promocao: produto.promocao || false,
        tempo: Date.now(),
        reservaId: novaReservaId
      });
    }

    atualizarCarrinho();
    salvarCarrinhoLocal();

    if (selectId) {
      const select = document.getElementById(selectId);

      if (select) {
        select.selectedIndex = 0;

        const numero = selectId.replace("op", "");
        const stock = document.getElementById("stock" + numero);

        if (stock) {
          stock.innerHTML = "Selecione uma opção";
        }

        const img = document.getElementById("img" + numero);

        if (img) {
          img.src = `imagens/${produto.pasta}/${produto.imagem}`;
        }
      }
    }

  } catch (erro) {
    console.error("Erro ao adicionar produto:", erro);

    if (erro.message === "Sem estoque") {
      alert("Produto sem estoque disponível.");
    } else {
      alert("Não foi possível adicionar o produto. Tente novamente.");
    }
  }
};

async function atualizarQuantidadeReservada(item, novaQtd, movimento) {
  const produtoRef = doc(db, "Produtos", item.produtoId);

  const reservaRef = item.reservaId
    ? doc(db, "Reservas", item.reservaId)
    : null;

  const novaReservaRef = doc(collection(db, "Reservas"));

  return await runTransaction(db, async (transaction) => {
    const produtoSnap = await transaction.get(produtoRef);

    if (!produtoSnap.exists()) {
      throw new Error("Produto não encontrado");
    }

    let reservaSnap = null;

    if (reservaRef) {
      reservaSnap = await transaction.get(reservaRef);
    }

    const produto = produtoSnap.data();
    const estoque = produto.estoque;

    const estoqueNumerico = typeof estoque === "number";
    const chave = item.opcao || "unico";

    let atual = estoqueNumerico
      ? Number(estoque)
      : Number(estoque?.[chave] || 0);

    let novoEstoque;

    if (movimento === "aumentar") {
      if (atual < 1) {
        throw new Error("Sem estoque");
      }

      novoEstoque = atual - 1;
    } else {
      novoEstoque = atual + 1;
    }

    if (estoqueNumerico) {
      transaction.update(produtoRef, {
        estoque: novoEstoque
      });
    } else {
      transaction.update(produtoRef, {
        [`estoque.${chave}`]: novoEstoque
      });
    }

    const reservaAtiva =
      reservaSnap &&
      reservaSnap.exists() &&
      reservaSnap.data().status === "ativa";

    let reservaIdFinal = item.reservaId || null;

    if (movimento === "aumentar") {
      if (reservaAtiva) {
        transaction.update(reservaRef, {
          qtd: novaQtd
        });
      } else {
        transaction.set(novaReservaRef, {
          produtoId: item.produtoId,
          nome: item.nome,
          opcao: item.opcao || "unico",
          qtd: novaQtd,
          status: "ativa",
          criadoEmMs: Date.now(),
          criadoEm: serverTimestamp()
        });

        reservaIdFinal = novaReservaRef.id;
      }
    } else if (reservaAtiva) {
      transaction.update(reservaRef, {
        qtd: novaQtd,
        ...(novaQtd <= 0
          ? {
              status: "expirada",
              expiradoEmMs: Date.now()
            }
          : {})
      });
    }

    return reservaIdFinal;
  });
}


window.aumentar = async function(index) {
  let item = carrinho[index];
  if (!item) return;

  try {
    const novaQtd = Number(item.qtd || 0) + 1;

    const reservaId = await atualizarQuantidadeReservada(
      item,
      novaQtd,
      "aumentar"
    );

    item.qtd = novaQtd;
    item.reservaId = reservaId;
    item.tempo = Date.now();

    atualizarCarrinho();
    salvarCarrinhoLocal();

  } catch (erro) {
    console.error("Erro ao aumentar quantidade:", erro);

    if (erro.message === "Sem estoque") {
      alert("Sem estoque disponível.");
    } else {
      alert("Não foi possível atualizar a quantidade.");
    }
  }
};


window.diminuir = async function(index) {
  let item = carrinho[index];
  if (!item) return;

  try {
    const novaQtd = Number(item.qtd || 0) - 1;

    await atualizarQuantidadeReservada(
      item,
      novaQtd,
      "diminuir"
    );

    if (novaQtd <= 0) {
      carrinho.splice(index, 1);
    } else {
      item.qtd = novaQtd;
      item.tempo = Date.now();
    }

    atualizarCarrinho();
    salvarCarrinhoLocal();

  } catch (erro) {
    console.error("Erro ao diminuir quantidade:", erro);
    alert("Não foi possível devolver o produto ao estoque.");
  }
};

window.remover = async function(index) {
  let item = carrinho[index];
  if (!item) return;

  try {
    await expirarReserva(item);

    carrinho.splice(index, 1);
    atualizarCarrinho();
    salvarCarrinhoLocal();
  } catch (erro) {
    console.error("Erro ao remover item:", erro);
    alert("Erro ao devolver estoque.");
  }
};

window.limparCarrinho = async function() {
  if (limpandoCarrinho) return;

  limpandoCarrinho = true;

  try {
    const itensParaLimpar = [...carrinho];

    for (const item of itensParaLimpar) {
      await expirarReserva(item);
    }

    carrinho = [];

    let pagamentoSelect = document.getElementById("pagamento");
    let entregaSelect = document.getElementById("entrega");
    let pedidoEl = document.getElementById("pedido");

    if (pagamentoSelect) pagamentoSelect.selectedIndex = 0;
    if (entregaSelect) entregaSelect.selectedIndex = 0;
    if (pedidoEl) pedidoEl.value = "";

    document.getElementById("nomeCliente").value = "";
    document.getElementById("contatoCliente").value = "";
    document.getElementById("observacoesPedido").value = "";

    const bairro = document.getElementById("bairroEntrega");

    if (bairro) bairro.selectedIndex = 0;

    salvarCarrinhoLocal();

  } catch (erro) {
    console.error("Erro ao limpar carrinho:", erro);
    alert("Erro ao devolver estoque.");

  } finally {
    limpandoCarrinho = false;
  }
};

  const contatoCliente = document.getElementById("contatoCliente").value.trim();

  let subtotal = 0;

  texto += `Cliente: ${nomeCliente}\n`;
  texto += `Contato: ${contatoCliente}\n`;

  let desconto = 0;

    subtotalElegivelPix >= Number(configLoja.minimoPix || 0)
  ) {
    desconto =
      subtotalElegivelPix *
      (Number(configLoja.descontoPix || 0) / 100);

  const total = subtotal + taxa - desconto;

  texto += "━━━━━━━━━━━━━━━━━━━━\n";
  texto += `💰 Subtotal: R$ ${subtotal.toFixed(2)}\n`;

  }

  texto += "━━━━━━━━━━━━━━━━━━━━";

  try {

    const pedido =
    await salvarPedidoFirebaseComDesconto(
        subtotal,
        subtotalElegivelPix,
        taxa,
        desconto,
        total,
        pagamento,
        entregaTexto,
        nomeCliente,
        contatoCliente,
        observacoes,
        enderecoEntrega
      );

    texto = texto.replace(
        /^🛍️ \*NOVO PEDIDO\*\n\n/,

    document.getElementById("observacoesPedido").value = "";

    if (area) area.style.display = "none";

    const endereco = document.getElementById("enderecoEntrega");
    if (endereco) endereco.value = "";

    taxaEntregaBairro = 0;

    carrinho = [];
    salvarCarrinhoLocal();
    atualizarCarrinho();

  } catch (erro) {

    alert("Erro ao finalizar pedido.");
  }

};

async function gerarNumeroPedido() {

  const contadorRef = doc(db, "Configuracoes", "ContadorPedidos");

  let numeroPedido = 0;

  await runTransaction(db, async (transaction) => {

    const snap = await transaction.get(contadorRef);

    if (!snap.exists()) {

      numeroPedido = 1;

      transaction.set(contadorRef, {
        ultimoNumero: numeroPedido
      });

    } else {

      numeroPedido = (snap.data().ultimoNumero || 0) + 1;

      transaction.update(contadorRef, {
        ultimoNumero: numeroPedido
      });

    }

  });

  return numeroPedido;

}

          Esperamos você novamente em breve.

          `;

          break;

          case "cancelado":

      }

      if (pedido.entrega) {

}

window.atualizarStatusPedido = async function (pedidoId, novoStatus) {

  if (window.atualizandoPedido) {
    return;
  }

  window.atualizandoPedido = true;

  try {

    const pedidoRef = doc(db, "Pedidos", pedidoId);

    await runTransaction(db, async (transaction) => {

      const pedidoSnap = await transaction.get(pedidoRef);

      if (!pedidoSnap.exists()) {
        throw new Error("Pedido não encontrado");
      }

      const pedido = pedidoSnap.data();

      const statusAtual =
        (pedido.status || "novo").toLowerCase();

      const itens =
        Array.isArray(pedido.itens)
          ? pedido.itens
          : [];

      // Devolve o estoque somente ao cancelar
      // um pedido que ainda não estava cancelado
      if (
        novoStatus === "cancelado" &&
        statusAtual !== "cancelado"
      ) {

        const produtosLidos = [];

        for (const item of itens) {

          if (!item.produtoId) {
            continue;
          }

          const produtoRef =
            doc(db, "Produtos", item.produtoId);

          const produtoSnap =
            await transaction.get(produtoRef);

          if (!produtoSnap.exists()) {
            continue;
          }

          produtosLidos.push({
            item,
            produtoRef,
            produto: produtoSnap.data()
          });

        }

        for (const dado of produtosLidos) {

          const estoque =
            dado.produto.estoque || {};

          const chave =
            dado.item.opcao || "unico";

          const atual =
            Number(estoque[chave] || 0);

          const qtd =
            Number(dado.item.qtd || 0);

          transaction.update(
            dado.produtoRef,
            {
              [`estoque.${chave}`]:
                atual + qtd
            }
          );

        }

      }

      transaction.update(
        pedidoRef,
        {
          status: novoStatus
        }
      );

    });

    // Tenta enviar a mensagem correspondente
    // ao novo status
    let mensagemEnviada = false;

    if (novoStatus !== "novo") {

      mensagemEnviada =
        await enviarMensagemPedido(pedidoId);

    }

    // Atualiza novamente a lista de pedidos
    if (
      typeof filtrarPedidosAdmin === "function"
    ) {

      filtrarPedidosAdmin(
        statusFiltroPedidosAtual
      );

    }

    if (mensagemEnviada) {

      alert(
        "Status atualizado e mensagem enviada para o WhatsApp."
      );

    } else {

      alert(
        "Status atualizado.\n\n" +
        "A mensagem do WhatsApp não foi enviada."
      );

    }

  } catch (erro) {

    console.error(
      "Erro ao atualizar status do pedido:",
      erro
    );

    alert(
      "Erro ao atualizar status."
    );

  } finally {

    // Nunca deixa o sistema travado
    window.atualizandoPedido = false;

  }

};

window.enviarMensagemPedido = async function (pedidoId) {

  try {

    const pedidoRef = doc(db, "Pedidos", pedidoId);
    const pedidoSnap = await getDoc(pedidoRef);

    if (!pedidoSnap.exists()) {
      alert("Pedido não encontrado.");
      return false;
    }

    const pedido = pedidoSnap.data();

    const status = pedido.status || "novo";

    // Não enviar mensagem automática para o status "novo"
    if (status === "novo") {
      alert("O pedido ainda está como NOVO. A mensagem para o cliente será enviada quando o status mudar para Aguardando Pagamento.");
      return false;
    }

    const historicoWhatsapp = pedido.whatsapp || {};

    // Verifica se já foi enviada uma mensagem para este status
    if (historicoWhatsapp[status] === true) {

      const reenviar = confirm(
        "Já existe uma mensagem enviada para este status.\n\nDeseja enviar novamente?"
      );

      if (!reenviar) {
        return false;
      }
    }

    const mensagem = gerarMensagemStatusPedido(
      pedido,
      status
    );

    let telefone = (pedido.contatoCliente || "").replace(/\D/g, "");

    if (!telefone) {
      alert("Cliente sem telefone.");
      return false;
    }

    if (!telefone.startsWith("55")) {
      telefone = "55" + telefone;
    }

    const urlWhatsapp =
      `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;

    const janela = window.open(
      urlWhatsapp,
      "_blank"
    );

    // Se o navegador bloqueou a abertura
    if (!janela) {

      alert(
        "O navegador bloqueou a abertura do WhatsApp.\n\n" +
        "Permita pop-ups para este site e tente novamente."
      );

      return false;
    }

    // Só registra no histórico depois de abrir o WhatsApp
    await updateDoc(pedidoRef, {

      [`whatsapp.${status}`]: true,

      ultimoEnvioWhatsapp: serverTimestamp()

    });

    return true;

  } catch (erro) {

    console.error(
      "Erro ao enviar mensagem WhatsApp:",
      erro
    );

    alert(
      "Erro ao abrir o WhatsApp."
    );

    return false;

  }

};

function atualizarSelect(selectId, stockId) {
  let select = document.getElementById(selectId);
  if (!select) return;

  let id = stockId.replace("stock", "");
  let produto = produtos[id - 1];
  if (!produto) return;

  let estoque = produto.estoque || {};

  for (let i = 0; i < select.options.length; i++) {
    let option = select.options[i];
    let op = option.value;

    if (!op) continue;

    let textoOriginal = op;
    let qtd = Number(estoque[op] || 0);

    if (qtd <= 0) {
      option.disabled = true;
      option.text = textoOriginal + " (Esgotado)";
    } else {
      option.disabled = false;
      option.text = textoOriginal;
    }
  }
}

async function expirarReserva(item) {
  if (!item || !item.produtoId) return;

  const produtoRef = doc(db, "Produtos", item.produtoId);

  // Garante um ID fixo para impedir devoluções duplicadas.
  if (!item.reservaId) {
    item.reservaId = doc(collection(db, "Reservas")).id;
  }

  const reservaRef = doc(db, "Reservas", item.reservaId);

  await runTransaction(db, async (transaction) => {
    const produtoSnap = await transaction.get(produtoRef);
    const reservaSnap = await transaction.get(reservaRef);

    if (!produtoSnap.exists()) return;

    // Se já foi expirada, não devolve o estoque novamente.
    if (
      reservaSnap.exists() &&
      reservaSnap.data().status !== "ativa"
    ) {
      return;
    }

    const produto = produtoSnap.data();
    const estoque = produto.estoque;
    const chave = item.opcao || "unico";

    const quantidade = Number(item.qtd || 0);

    if (quantidade <= 0) return;

    if (typeof estoque === "number") {
      transaction.update(produtoRef, {
        estoque: Number(estoque) + quantidade
      });
    } else {
      const atual = Number(estoque?.[chave] || 0);

      transaction.update(produtoRef, {
        [`estoque.${chave}`]: atual + quantidade
      });
    }

    transaction.set(reservaRef, {
      produtoId: item.produtoId,
      nome: item.nome,
      opcao: chave,
      qtd: quantidade,
      status: "expirada",
      expiradoEmMs: Date.now()
    }, { merge: true });
  });
}

async function limparReservas() {
  if (limpandoCarrinho) return;
  let agora = Date.now();
  let mudou = false;

  for (let i = carrinho.length - 1; i >= 0; i--) {
    let item = carrinho[i];

    if (agora - item.tempo > tempoReserva) {

      // 🔒 evita rodar duas vezes no mesmo item
      const chaveProc = item.reservaId || `${item.produtoId}_${item.opcao}`;

      if (reservasProcessando.has(chaveProc)) continue;

      reservasProcessando.add(chaveProc);

      try {
        await expirarReserva(item);
        carrinho.splice(i, 1);
        mudou = true;
      } catch (erro) {
        console.error("Erro ao expirar:", erro);
      } finally {
        reservasProcessando.delete(chaveProc);
      }
    }
  }

  if (mudou) {
    salvarCarrinhoLocal();
    atualizarCarrinho();
  }
}

let unsubscribeDashboardVendas = null;
let pedidosDashboardCache = [];
let periodoDashboardAtual = "total";

function renderizarDashboardVendas(periodo = "total") {

  let totalPedidos = 0;
  let faturamento = 0;
  let produtosVendidos = {};
  let pedidosPendentes = 0;

  const agora = new Date();

  pedidosDashboardCache.forEach(pedido => {

    if (pedido.status !== "concluido") {
      pedidosPendentes++;
      return;
    }

    if (!pedido.criadoEm) return;

    let dataPedido;

    if (pedido.criadoEm.toDate) {
      dataPedido = pedido.criadoEm.toDate();
    } else {
      dataPedido = new Date(pedido.criadoEm);
    }

    let incluir = true;

    if (periodo === "hoje") {

      incluir =
        dataPedido.getDate() === agora.getDate() &&
        dataPedido.getMonth() === agora.getMonth() &&
        dataPedido.getFullYear() === agora.getFullYear();

    } else if (periodo === "7dias") {

      let limite = new Date();
      limite.setDate(limite.getDate() - 7);

      incluir = dataPedido >= limite;

    } else if (periodo === "30dias") {

      let limite = new Date();
      limite.setDate(limite.getDate() - 30);

      incluir = dataPedido >= limite;
    }

    if (!incluir) return;

    totalPedidos++;
    faturamento += Number(pedido.total || 0);

    let itensPedido = Array.isArray(pedido.itens)
      ? pedido.itens
      : [];

    itensPedido.forEach(item => {

      let nome = item.nome || "Produto";
      let qtd = Number(item.qtd || 0);

      produtosVendidos[nome] =
        (produtosVendidos[nome] || 0) + qtd;
    });

  });

  let ranking = Object.entries(produtosVendidos)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);

  let rankingHTML = ranking.length
    ? ranking.map((item, index) => `
      <p style="margin:6px 0;">
        ${index + 1}º 🏆 ${item[0]} — ${item[1]} vendas
      </p>
    `).join("")
    : "<p>Nenhuma venda encontrada</p>";

  let graficoHTML = ranking.map(item => {

    let largura = item[1] * 20;

    return `
      <div style="margin:10px 0;">
        <div style="font-size:14px;margin-bottom:4px;">
          ${item[0]} (${item[1]})
        </div>

        <div style="
          height:22px;
          width:${largura}px;
          background:linear-gradient(90deg,#7c3aed,#c084fc);
          border-radius:6px;
        "></div>
      </div>
    `;

  }).join("");

  let box = document.getElementById("dashboardVendas");

  if (!box) return;

  box.innerHTML = `
    <h2>📊 Dashboard (${periodo})</h2>

    <p>📦 Pedidos: ${totalPedidos}</p>

    <p>⏳ Pedidos Pendentes: ${pedidosPendentes}</p>

    <p>💰 Faturamento: R$ ${faturamento.toFixed(2)}</p>

    <h3 style="margin-top:20px;">
      🏆 Top 5 Produtos
    </h3>

    ${rankingHTML}

    <h3 style="margin-top:24px;">
      📈 Gráfico de vendas
    </h3>

    ${graficoHTML || "<p>Sem dados</p>"}
  `;
}

window.dashboardVendas = function (periodo = "total") {

  periodoDashboardAtual = periodo;

  // Reaproveita os dados recebidos enquanto a consulta estiver ativa.
  if (unsubscribeDashboardVendas) {
    renderizarDashboardVendas(periodoDashboardAtual);
    return;
  }

  const pedidosRef = collection(db, "Pedidos");

  unsubscribeDashboardVendas = onSnapshot(pedidosRef, (snapshot) => {

    pedidosDashboardCache = snapshot.docs.map(docSnap => docSnap.data());
    renderizarDashboardVendas(periodoDashboardAtual);

  }, (erro) => {
    console.error("Erro ao carregar Dashboard:", erro);
    const box = document.getElementById("dashboardVendas");
    if (box) box.textContent = "Erro ao carregar o Dashboard. Veja o console.";
  });
};

window.exportarRelatorioCSV = async function () {
  try {
    const pedidosConcluidosRef = query(
      collection(db, "Pedidos"),
      where("status", "==", "concluido")
    );

    const snapshot = await getDocs(pedidosConcluidosRef);

    let linhas = [
      ["Data", "Pagamento", "Entrega", "Total", "Itens"]
    ];

    snapshot.forEach(docSnap => {

      let pedido = docSnap.data();

      if (pedido.status !== "concluido") return;

      let data = pedido.criadoEm?.toDate
        ? pedido.criadoEm.toDate().toLocaleString("pt-BR")
        : "";

      let itens = Array.isArray(pedido.itens)
        ? pedido.itens.map(i => `${i.nome} (${i.qtd})`).join(" | ")
        : "";

      linhas.push([
        data,
        pedido.pagamento || "",
        pedido.entrega || "",
        pedido.total || 0,
        itens
      ]);
    });

    let csv = linhas.map(l =>
      l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")
    ).join("\n");

    // ✅ BOM para Excel reconhecer UTF-8 corretamente
    let csvComBOM = "\uFEFF" + csv;

    let blob = new Blob([csvComBOM], { type: "text/csv;charset=utf-8;" });
    let url = URL.createObjectURL(blob);

    let link = document.createElement("a");
    link.href = url;
    link.download = "relatorio_vendas.csv";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);
  } catch (erro) {
    console.error("Erro ao exportar CSV:", erro);
    alert("Erro ao exportar relatório.");
  }
};

function obterCategoriasProduto(p) {
  const adicionais = Array.isArray(p.categoriasAdicionais)
    ? p.categoriasAdicionais
    : [];

  return [...new Set(
    [p.categoria, ...adicionais]
      .map(c => (c || "").trim())
      .filter(Boolean)
  )];
}

function produtoPodeUsarPrecoLive(p) {
  const temCategoriaAdicional =
    Array.isArray(p.categoriasAdicionais) &&
    p.categoriasAdicionais.some(
      c => typeof c === "string" && c.trim()
    );

  return (
    (configLoja.liveAtiva || temCategoriaAdicional) &&
    p.liveAtivo &&
    Number(p.precoLive) > 0
  );
}

window.apagarPedidosCancelados = async function () {

  if (!confirm("Deseja apagar todos os pedidos cancelados?")) {
    return;
  }

  try {

    const pedidosCanceladosRef = query(
      collection(db, "Pedidos"),
      where("status", "==", "cancelado")
    );

    const snapshot = await getDocs(pedidosCanceladosRef);

    let apagados = 0;

    for (const docSnap of snapshot.docs) {
      await deleteDoc(
        doc(db, "Pedidos", docSnap.id)
      );

      apagados++;
    }

    alert(`${apagados} pedidos cancelados removidos.`);

  } catch (erro) {

    console.error(erro);
    alert("Erro ao apagar pedidos.");

  }
};

window.filtrarPedidosAdmin = function (statusFiltro = "todos") {
  statusFiltroPedidosAtual = statusFiltro;

  if (unsubscribePedidosAdmin) {
    unsubscribePedidosAdmin();
    unsubscribePedidosAdmin = null;
  }

  const pedidosRef = query(
    collection(db, "Pedidos"),
    orderBy("criadoEm", "desc")
  );

    unsubscribePedidosAdmin = onSnapshot(pedidosRef, (snapshot) => {
    let lista = document.getElementById("listaPedidosAdmin");
    if (!lista) return;

    let pedidosHTML = `
      <div style="
        display:grid;
        grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
        gap:14px;
      ">
    `;

    let encontrou = false;

    const busca = (
      document.getElementById("buscaPedidoAdmin")?.value || ""
    ).toLowerCase().trim();

    snapshot.forEach((docSnap) => {
      let p = docSnap.data();
      let status = (p.status || "novo").toLowerCase();

      if (statusFiltro !== "todos" && status !== statusFiltro) {
        return;
      }

      if (busca) {

          const normalizarTexto = (valor) =>
              String(valor || "")
                  .normalize("NFD")
                  .replace(/[\u0300-\u036f]/g, "")
                  .toLowerCase()
                  .trim();

          const termo = normalizarTexto(busca);
          const numeroBruto = String(p.numeroPedido || "");
          const numero = numeroBruto.padStart(6, "0");
          const nome = normalizarTexto(p.nomeCliente);
          const telefone = String(p.contatoCliente || "").replace(/\D/g, "");
          const pesquisaNumerica = busca.replace(/\D/g, "");

          const encontrado =
              normalizarTexto(numero).includes(termo) ||
              normalizarTexto(numeroBruto).includes(termo) ||
              nome.includes(termo) ||
              (pesquisaNumerica.length > 0 && telefone.includes(pesquisaNumerica));

          if (!encontrado) return;

      }

      encontrou = true;

      let itens = Array.isArray(p.itens)
        ? p.itens.map(i => `${i.nome} (${i.qtd}x)`).join("<br>")
        : "Sem itens";

      let dataPedido = p.criadoEm?.toDate
        ? p.criadoEm.toDate().toLocaleString("pt-BR")
        : "";

      let corStatus = "#666";
      let fundoStatus = "#f3f3f3";

      if (status === "novo") {
        corStatus = "#8a6d00";
        fundoStatus = "#fff7d6";

        corStatus = "#a16207";
        fundoStatus = "#fef3c7";
      } else if (status === "confirmado") {
        corStatus = "#166534";
        fundoStatus = "#dcfce7";
      } else if (status === "separacao") {
        corStatus = "#9a4d00";
        fundoStatus = "#ffe8cc";
      } else if (status === "pronto") {
        corStatus = "#0b5394";
        fundoStatus = "#d9ecff";
      } else if (status === "concluido") {
        corStatus = "#0f6b2f";
        fundoStatus = "#dff7e5";
      } else if (status === "cancelado") {
        corStatus = "#a61b1b";
        fundoStatus = "#ffe0e0";
      }

      let textoStatus = "";

      switch (status) {
        case "novo":
          textoStatus = "🟡 Novo";
          break;

        case "aguardando_pagamento":
          textoStatus = "💰 Aguardando Pagamento";
          break;

        case "confirmado":

                  ❌ Pedido cancelado
              </div>
          ` : ""}

          </div>
        </div>
      `;
    });

    pedidosHTML += `</div>`;

    lista.innerHTML = encontrou ? pedidosHTML : "Nenhum pedido nesse filtro.";
  });
};

window.criarProduto = async function () {
  let nome = document.getElementById("novo_nome").value.trim();
  let marca = document.getElementById("novo_marca").value.trim() || "";
  let categoria = document.getElementById("novaCategoria").value.trim() || "";
  let categoriasAdicionaisTexto =
  document.getElementById("novasCategoriasAdicionais")?.value.trim() || "";

  let categoriasAdicionais = [
    ...new Set(
      categoriasAdicionaisTexto
        .split(",")
        .map(c => c.trim())
        .filter(Boolean)
    )
  ];
  let preco = parseFloat(document.getElementById("novo_preco").value);
  let pasta = document.getElementById("novo_pasta").value.trim() || "";
  let imagem = document.getElementById("novo_imagem").value.trim() || "";
  let promocao = document.getElementById("novaPromocao").checked;
  let destaque = document.getElementById("novoDestaque")?.checked || false;

  let opcoesTexto = document.getElementById("novo_opcoes").value.trim();
  let opcoes = opcoesTexto
    ? opcoesTexto.split(",").map(o => o.trim()).filter(o => o)
    : [];

  if (!nome) {
    alert("Informe o nome do produto");
    return;
  }

  if (isNaN(preco) || preco <= 0) {
    alert("Informe um preço válido");
    return;
  }

  let estoque = {};

  if (opcoes.length > 0) {
    opcoes.forEach(op => {
      estoque[op] = 0;
    });
  } else {
    estoque = { unico: 0 };
  }

  let novo = {
    nome,
    marca,
    categoria,
    categoriasAdicionais,
    promocao,
    destaque,
    preco,
    ativo: true,
    liveAtivo: false,
    precoLive: 0,
    ordem: 999,
    pasta,
    imagem,
    opcoes,
    estoque
  };

  try {
    await addDoc(collection(db, "Produtos"), novo);
    alert("Produto criado no Firebase!");
    window.fecharAdmin();
  } catch (erro) {
    console.error("Erro ao criar produto:", erro);
    alert("Erro ao criar produto no Firebase.");
  }
};

window.salvarEdicaoProdutos = async function () {
  try {

    const produtosAtuais = [...produtos];

    // 2) Lê TODOS os dados da tela antes de começar a salvar
    const dadosAtualizados = produtosAtuais.map((p, index) => {
      let nome = document.getElementById(`p_nome_${index}`)?.value.trim() || "";
      let marca = document.getElementById(`p_marca_${index}`)?.value.trim() || "";
      let categoria = document.getElementById(`p_categoria_${index}`)?.value.trim() || "";
      let categoriasAdicionaisTexto =
        document.getElementById(`p_categoriasAdicionais_${index}`)?.value.trim() || "";

      let categoriasAdicionais = [
        ...new Set(
          categoriasAdicionaisTexto
            .split(",")
            .map(c => c.trim())
            .filter(Boolean)
        )
      ];
      let promocao = document.getElementById(`p_promocao_${index}`)?.checked || false;
      let destaque = document.getElementById(`p_destaque_${index}`)?.checked || false;
      let ativo =
        document.getElementById(`p_ativo_${index}`)?.checked ?? true;
      let liveAtivo =
        document.getElementById(`p_live_${index}`)?.checked || false;

      let precoLive =
        parseFloat(
          document.getElementById(`p_precoLive_${index}`)?.value || 0
        );
      let preco = parseFloat(document.getElementById(`p_preco_${index}`)?.value || 0);
      let ordem = parseInt(document.getElementById(`p_ordem_${index}`)?.value || 999);
      let pasta = document.getElementById(`p_pasta_${index}`)?.value.trim() || "";
      let imagem = document.getElementById(`p_imagem_${index}`)?.value.trim() || "";
      let opcoesTexto = document.getElementById(`p_opcoes_${index}`)?.value.trim() || "";

      let novasOpcoes = opcoesTexto
        ? opcoesTexto.split(",").map(o => o.trim()).filter(o => o)
        : [];

      let novoEstoque = {};

      if (novasOpcoes.length > 0) {
        novasOpcoes.forEach(op => {
          let campo = document.getElementById(`p_estoque_${index}_${op}`);
          novoEstoque[op] = campo ? parseInt(campo.value || 0) : 0;
        });
      } else {
        let campoUnico = document.getElementById(`p_estoque_${index}_unico`);
        novoEstoque = {
          unico: campoUnico ? parseInt(campoUnico.value || 0) : 0
        };
      }

      return {
        id: p.id,
        nome,
        marca,
        categoria,
        categoriasAdicionais,
        promocao,
        destaque,
        ativo,
        preco,
        liveAtivo,
        precoLive,
        ordem,
        pasta,
        imagem,
        opcoes: novasOpcoes,
        estoque: novoEstoque
      };
    });

    // 3) Agora salva tudo
    for (const item of dadosAtualizados) {
      await updateDoc(doc(db, "Produtos", item.id), {
        nome: item.nome,
        marca: item.marca,
        categoria: item.categoria,
        categoriasAdicionais: item.categoriasAdicionais,
        promocao: item.promocao,
        destaque: item.destaque,
        ativo: item.ativo,
        preco: item.preco,
        liveAtivo: item.liveAtivo,
        precoLive: item.precoLive,
        ordem: item.ordem,
        pasta: item.pasta,
        imagem: item.imagem,
        opcoes: item.opcoes,
        estoque: item.estoque
      });

    }

    alert("Produtos e estoques atualizados com sucesso!");
  } catch (erro) {
    console.error("Erro ao salvar produtos:", erro);
    alert("Erro ao salvar edição dos produtos.");
  }
};

window.removerProduto = async function (index) {

  } catch (erro) {
    console.error("Erro ao remover produto:", erro);
    alert("Erro ao remover produto do Firebase.");
  }
};

window.migrarEstoque = async function () {
  try {
    const produtosRef = collection(db, "Produtos");
    const snapshot = await getDocs(produtosRef);

    let atualizados = 0;

    for (let docSnap of snapshot.docs) {
      const data = docSnap.data();
      const estoque = data.estoque;

      // 🔹 Se já for objeto, pula
      if (typeof estoque === "object" && estoque !== null) continue;

      // 🔹 Se for número, converte
      if (typeof estoque === "number") {
        await updateDoc(doc(db, "Produtos", docSnap.id), {
          estoque: {
            unico: estoque
          }
        });

        console.log(`Convertido: ${data.nome}`);
        atualizados++;
      }

      // 🔹 Se estiver vazio/null
      if (!estoque) {
        await updateDoc(doc(db, "Produtos", docSnap.id), {
          estoque: {
            unico: 0
          }
        });

        console.log(`Corrigido vazio: ${data.nome}`);
        atualizados++;
      }
    }

    alert(`Migração concluída! ${atualizados} produtos atualizados.`);
  } catch (erro) {
    console.error("Erro na migração:", erro);
  }
};
